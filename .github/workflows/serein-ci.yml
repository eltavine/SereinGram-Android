name: SereinGram CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: serein-ci-${{ github.workflow }}-${{ github.ref }}
  # Cancelled runs save no caches, so runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_VERSION: 27.2.12479018
  # The SHA-1 of the release signing certificate, public by nature; empty skips the checks against it.
  SEREIN_SIGNING_SHA1: ${{ vars.SEREIN_SIGNING_SHA1 }}

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-24.04
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Upstream files stay within the intrusion budget.
        run: uv run Tools/serein/upstream_budget.py

      - name: SereinGram's workflows and scripts pass their linters.
        run: |
          uvx --from actionlint-py==1.7.12.25 actionlint
          shellcheck Tools/serein/*.sh
          uvx ruff@0.16.10 check Tools/serein
          uvx ruff@0.16.10 format --check Tools/serein

      - name: The release script works.
        run: uv run --with pytest==8.4.2 --with httpx==0.28.1 pytest -q Tools/serein/ci

      - name: The brand string overlay matches upstream strings.
        run: |
          uv run Tools/serein/brand/generate_strings.py
          git add --intent-to-add TMessagesProj/src/serein/res
          git diff --exit-code -- TMessagesProj/src/serein/res

      - name: Set up Node.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install commitlint.
        run: npm ci --prefix Tools/serein --no-audit --no-fund

      - name: Commit range.
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$FROM" || "$FROM" =~ ^0+$ ]] || ! git cat-file -e "$FROM^{commit}"; then
            FROM="$TO~1"
          fi
          echo "RANGE=$FROM..$TO" >> "$GITHUB_ENV"

      - name: New commits follow Conventional Commits in English.
        run: Tools/serein/lint_commits.sh "$RANGE"

  modules:
    name: Module tests
    runs-on: ubuntu-24.04
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the libraries Gradle configures.
        run: git submodule update --init --depth 1 TMessagesProj/lib/jlatexmath TMessagesProj_Modules/media

      - name: Set up JDK 21.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle.
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test the SereinGram modules.
        run: ./gradlew sereinCheck --console=plain

      - name: Test SereinGram's code in the app.
        run: ./gradlew :TMessagesProj:testReleaseUnitTest --tests 'com.eltavine.sereingram.*' --console=plain

  # Telegram ships FFmpeg, BoringSSL and the other libraries it links prebuilt, under
  # TMessagesProj/jni/prebuild, and builds the rest along with its own code.
  native:
    name: Native build (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Native library cache key.
        id: key
        uses: ./.github/actions/native-cache-key
        with:
          abi: ${{ matrix.abi }}
          ndk-version: ${{ env.NDK_VERSION }}
          signing-sha1: ${{ env.SEREIN_SIGNING_SHA1 }}

      - name: Native library cache.
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: TMessagesProj/src/main/libs
          key: ${{ steps.key.outputs.key }}

      - name: Check out the native sources.
        if: steps.cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1

      - name: Set up JDK 21.
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle.
        if: steps.cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up the NDK.
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ndk;${{ env.NDK_VERSION }}

      - name: Build the Telegram native library.
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          NATIVE_TARGET: ${{ matrix.abi }}
        run: ./run libs native

  apk:
    name: APK
    runs-on: ubuntu-24.04
    needs:
      - native
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the libraries Gradle configures.
        run: git submodule update --init --depth 1 TMessagesProj/lib/jlatexmath TMessagesProj_Modules/media

      - name: Build the APKs.
        id: build
        uses: ./.github/actions/build-apks
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          signing-sha1: ${{ env.SEREIN_SIGNING_SHA1 }}

      - name: Say what the APKs are for.
        if: env.SEREIN_SIGNING_SHA1 != ''
        run: echo "::notice::CI signs its APKs with the runner's debug key, so their native library refuses to load; nightly and stable builds are signed for it."

      - name: Upload the APKs.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SereinGram-${{ github.sha }}
          path: ${{ steps.build.outputs.apk-dir }}/*.apk
          if-no-files-found: error
