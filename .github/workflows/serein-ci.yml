name: SereinGram CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: serein-ci-${{ github.workflow }}-${{ github.ref }}
  # Cancelled runs save no caches, so runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_VERSION: 27.2.12479018
  # The SHA-1 of the release signing certificate, public by nature; empty skips the checks against it.
  SEREIN_SIGNING_SHA1: ${{ vars.SEREIN_SIGNING_SHA1 }}

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-24.04
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Upstream files stay within the intrusion budget.
        run: uv run Tools/serein/upstream_budget.py

      - name: SereinGram's workflows and scripts pass their linters.
        run: |
          uvx --from actionlint-py==1.7.12.25 actionlint
          shellcheck Tools/serein/*.sh
          uvx ruff@0.16.10 check Tools/serein
          uvx ruff@0.16.10 format --check Tools/serein

      - name: The release script works.
        run: uv run --with pytest==8.4.2 --with httpx==0.28.1 pytest -q Tools/serein/ci

      - name: The brand string overlay matches upstream strings.
        run: |
          uv run Tools/serein/brand/generate_strings.py
          git add --intent-to-add TMessagesProj/src/serein/res
          git diff --exit-code -- TMessagesProj/src/serein/res

      - name: Set up Node.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install commitlint.
        run: npm ci --prefix Tools/serein --no-audit --no-fund

      - name: Commit range.
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$FROM" || "$FROM" =~ ^0+$ ]] || ! git cat-file -e "$FROM^{commit}"; then
            FROM="$TO~1"
          fi
          echo "RANGE=$FROM..$TO" >> "$GITHUB_ENV"

      - name: New commits follow Conventional Commits in English.
        run: Tools/serein/lint_commits.sh "$RANGE"

  modules:
    name: Module tests
    runs-on: ubuntu-24.04
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the libraries Gradle configures.
        run: git submodule update --init --depth 1 TMessagesProj/lib/jlatexmath TMessagesProj_Modules/media

      - name: Set up JDK 21.
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle.
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test the SereinGram modules.
        run: ./gradlew sereinCheck --console=plain

      - name: Test SereinGram's code in the app.
        run: ./gradlew :TMessagesProj:testReleaseUnitTest --tests 'com.eltavine.sereingram.*' --console=plain

  apk:
    name: APK
    runs-on: ubuntu-24.04
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the libraries Gradle configures.
        run: git submodule update --init --depth 1 TMessagesProj/lib/jlatexmath TMessagesProj_Modules/media

      - name: Build the APKs.
        id: build
        uses: ./.github/actions/build-apks
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          signing-sha1: ${{ env.SEREIN_SIGNING_SHA1 }}

      - name: Say what the APKs are for.
        if: env.SEREIN_SIGNING_SHA1 != ''
        run: echo "::notice::CI signs its APKs with the runner's debug key, so their native library refuses to load; nightly and stable builds are signed for it."

      - name: Upload the APKs.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SereinGram-${{ github.sha }}
          path: ${{ steps.build.outputs.apk-dir }}/*.apk
          if-no-files-found: error
