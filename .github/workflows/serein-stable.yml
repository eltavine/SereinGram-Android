name: SereinGram Stable

# A version tag on main is tested like any commit, built, signed with the release key, published
# as the latest GitHub release and sent to the Telegram channel. The signing key and the bot's
# token are secrets of the telegram environment.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: serein-stable-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: 27.2.12479018
  SEREIN_SIGNING_SHA1: ${{ vars.SEREIN_SIGNING_SHA1 }}
  TELEGRAM_CHAT_ID: "-1004356403303"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/serein-ci.yml

  release:
    name: Release
    needs:
      - ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: telegram
    permissions:
      contents: write
    services:
      # The Bot API server Telegram publishes, which takes uploads past the cloud server's 50 MB.
      bot-api:
        image: aiogram/telegram-bot-api:10.3@sha256:ad102551801fd4afbfbe76c153c0f9d92855a4ba77a0eff15c2ad59b772b23c5
        env:
          # Telegram's own published API credentials, until SereinGram has its own.
          TELEGRAM_API_ID: "4"
          TELEGRAM_API_HASH: 014b35b6184100b085b0d0572f9b5103
          # Local mode is what lifts the upload limit to 2000 MB.
          TELEGRAM_LOCAL: "1"
        ports:
          - 8081:8081
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The build logic of the tagged commit gets the release key, so it must be reviewed history.
      - name: The tag is on main.
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; only commits on main are released."
            exit 1
          fi

      - name: Check out the libraries Gradle configures.
        run: git submodule update --init --depth 1 TMessagesProj/lib/jlatexmath

      - name: Check the secrets of the telegram environment.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          missing=()
          for name in TELEGRAM_BOT_TOKEN KEYSTORE_BASE64 KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Releasing needs these secrets of the telegram environment: ${missing[*]}"
            exit 1
          fi

      - name: Set up uv.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build the APKs.
        id: build
        uses: ./.github/actions/build-apks
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          signing-sha1: ${{ env.SEREIN_SIGNING_SHA1 }}
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASS }}
          key-alias: ${{ secrets.ALIAS_NAME }}
          key-password: ${{ secrets.ALIAS_PASS }}

      - name: Check who signed the APKs.
        id: verify
        env:
          APK_DIR: ${{ steps.build.outputs.apk-dir }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
        run: uv run Tools/serein/ci/release.py verify --apk-dir "$APK_DIR"

      - name: Publish the GitHub release.
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.build.outputs.apk-dir }}/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true

      - name: Send the APKs to Telegram.
        env:
          APK_DIR: ${{ steps.build.outputs.apk-dir }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SIGNER: ${{ steps.verify.outputs.signer }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: uv run Tools/serein/ci/release.py publish --apk-dir "$APK_DIR" --channel "$GITHUB_REF_NAME" --chat-id "$TELEGRAM_CHAT_ID" --signer "$SIGNER" --release-url "$RELEASE_URL"
