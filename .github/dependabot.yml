# SereinGram's own pins. Nagram's Gradle dependencies stay with Nagram and arrive through merges.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /Tools/serein
    schedule:
      interval: weekly
    groups:
      commitlint:
        patterns: ["@commitlint/*"]
