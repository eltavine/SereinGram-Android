name: Build SereinGram's APKs
description: >
  Compiles the native code and builds the release APKs of the checked out commit,
  signed with the given key, or with the runner's debug key when none is given.

inputs:
  ndk-version:
    description: The NDK used to compile the native libraries.
    required: true
  signing-sha1:
    description: The SHA-1 of the release signing certificate the native libraries check APKs against, if any.
    required: false
    default: ""
  keystore-base64:
    description: The release keystore, in base64.
    required: false
    default: ""
  keystore-password:
    description: The password of the release keystore.
    required: false
    default: ""
  key-alias:
    description: The alias of the release key.
    required: false
    default: ""
  key-password:
    description: The password of the release key.
    required: false
    default: ""

outputs:
  apk-dir:
    description: Where the APKs are, with Gradle's output-metadata.json.
    value: TMessagesProj/build/outputs/apk/release

runs:
  using: composite
  steps:
    - name: Check out the native sources.
      shell: bash
      run: git submodule update --init --depth 1

    - name: Set up JDK 21.
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: temurin

    - name: Set up Gradle.
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Set up the NDK.
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: ndk;${{ inputs.ndk-version }}

    # The commit's time, so that a rerun builds the same APK and finds Gradle's cache.
    - name: Stamp the build time.
      shell: bash
      run: sed -i "s/2000000000000/$(git log -1 --format=%ct)000/" gradle.properties

    - name: Build the APKs.
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEYSTORE_PASS: ${{ inputs.keystore-password }}
        ALIAS_NAME: ${{ inputs.key-alias }}
        ALIAS_PASS: ${{ inputs.key-password }}
        SEREIN_SIGNING_SHA1: ${{ inputs.signing-sha1 }}
      # Without TELEGRAM_APP_ID, the app keeps Nagram's API credentials: Telegram refuses logins with its own
      # published ones (API_ID_PUBLISHED_FLOOD).
      run: ./gradlew :TMessagesProj:assembleRelease --console=plain
